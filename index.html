<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefcf7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smith Vargas Wedding · Run of show</title>

  <!-- Organic design system (tokens + component classes) -->
  <link rel="stylesheet" href="styles.css?v=9">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; -webkit-text-size-adjust: 100%; }
    /* Inline the Organic tokens so every color/font var exists on the first
       paint — before styles.css loads — otherwise selected tabs render as light
       text on a not-yet-applied accent background (i.e. blank) on first land. */
    :root {
      --color-bg: #fefcf7;
      --color-surface: #ebddc5;
      --color-text: #201e1d;
      --color-accent: #c67139;
      --color-accent-2: #7a8a5e;
      --color-divider: color-mix(in srgb, #201e1d 16%, transparent);
      --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;
      --color-neutral-400:#c0b6a5;--color-neutral-500:#a19786;--color-neutral-600:#82796a;
      --color-neutral-700:#645c50;--color-neutral-800:#474238;--color-neutral-900:#2e2b25;
      --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;
      --color-accent-400:#f6a06b;--color-accent-500:#d67f48;--color-accent-600:#b2622d;
      --color-accent-700:#8c491a;--color-accent-800:#643312;--color-accent-900:#402310;
      --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;
      --color-accent-2-400:#aebf92;--color-accent-2-500:#8fa073;--color-accent-2-600:#728157;
      --color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;--color-accent-2-900:#272e1b;
      --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
      --space-1:4.4px;--space-2:8.8px;--space-3:13.2px;--space-4:17.6px;--space-6:26.4px;--space-8:35.2px;
      --radius-sm:8px;--radius-md:16px;--radius-lg:28px;
      --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
      --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
      --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);
    }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    @keyframes nowPulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent) 55%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--color-accent) 0%, transparent); } }
    @keyframes duePulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-2) 50%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--color-accent-2) 0%, transparent); } }
    input[type="checkbox"] { accent-color: var(--color-accent); }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + htm (JSX-like templates, no build step) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <!-- Supabase (shared live state) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
