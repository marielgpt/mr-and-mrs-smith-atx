<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfcfa">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smith Vargas Wedding · Run of show</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=67">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=67">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=67">

  <!-- Organic design system (tokens + component classes) -->
  <link rel="stylesheet" href="styles.css?v=67">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; -webkit-text-size-adjust: 100%; }
    /* Inline the Organic tokens so every color/font var exists on the first
       paint — before styles.css loads — otherwise selected tabs render as light
       text on a not-yet-applied accent background (i.e. blank) on first land. */
    :root {
      --color-bg: #fdfcfa;
      --color-surface: #f2ece6;
      --color-text: #201e1d;
      --color-accent: #a06a49;
      --color-accent-2: #2f4a6e;
      --color-divider: color-mix(in srgb, #201e1d 16%, transparent);
      --color-neutral-100:#f9f3f0;--color-neutral-200:#ece7e3;--color-neutral-300:#d9d3cf;
      --color-neutral-400:#bcb6b3;--color-neutral-500:#9d9794;--color-neutral-600:#7e7976;
      --color-neutral-700:#615c59;--color-neutral-800:#46413f;--color-neutral-900:#2f2a28;
      --color-accent-100:#fef2eb;--color-accent-200:#fee1d1;--color-accent-300:#fac8ab;
      --color-accent-400:#e1a988;--color-accent-500:#c68862;--color-accent-600:#a56a45;
      --color-accent-700:#815030;--color-accent-800:#5f371d;--color-accent-900:#41220e;
      --color-accent-2-100:#eff5ff;--color-accent-2-200:#dae9fe;--color-accent-2-300:#c0d6f5;
      --color-accent-2-400:#a0b9dc;--color-accent-2-500:#7e9ac1;--color-accent-2-600:#617ca1;
      --color-accent-2-700:#485f7d;--color-accent-2-800:#31445d;--color-accent-2-900:#1e2c3f;
      --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
      --space-1:4.4px;--space-2:8.8px;--space-3:13.2px;--space-4:17.6px;--space-6:26.4px;--space-8:35.2px;
      --radius-sm:8px;--radius-md:16px;--radius-lg:28px;
      --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
      --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
      --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);
    }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    @keyframes nowPulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent) 55%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--color-accent) 0%, transparent); } }
    @keyframes duePulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-2) 50%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--color-accent-2) 0%, transparent); } }
    input[type="checkbox"] { accent-color: var(--color-accent); }
    #root { min-height: 100vh; }
    /* Print / PDF: swap the app for the plain run-of-show + teardown document. */
    @media screen { .print-doc { display: none; } }
    @media print {
      @page { size: letter portrait; margin: 0.5in; }
      .app-screen { display: none !important; }
      html, body { background: #fff !important; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + htm (JSX-like templates, no build step) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
  <!-- Supabase (shared live state) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js?v=67"></script>
  <script src="app.js?v=67"></script>
</body>
</html>
