<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Vargas Wedding · Table numbers</title>
  <!-- Table number signs, 5 × 7 in, two per 8.5 × 11 sheet (landscape) with crop marks, double-sided.
       Same look as photos/sign.html: copper-foil notched double frame, copper script, navy didone,
       letterspaced small caps. Each sign lists its guests (from Downloads/table names.png),
       alphabetical by last name. Back pages swap left/right so each sign backs onto itself when the
       printer flips on the SHORT edge. Edit TABLES below. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Cormorant+Garamond:wght@600&family=Cormorant+SC:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    @page { size: letter landscape; margin: 0; }
    :root { --navy: #2f4a6e;
            --foil: linear-gradient(115deg, #6e3f22 0%, #b8743f 14%, #ecbd92 24%, #c4824d 34%, #7a4527 48%, #d79b6b 62%, #f2cba3 70%, #b06c3a 82%, #74411f 100%); }
    html, body { margin: 0; background: #ecebe8; }
    body { color: var(--navy); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* 11 × 8.5 in sheet; two 5 × 7 trims side by side at x 0.5 → 5.5 → 10.5 in, y 0.75 → 7.75 in. */
    .page { position: relative; width: 11in; height: 8.5in; margin: 24px auto; background: #fff; box-shadow: 0 12px 32px rgba(30,40,60,.18); overflow: hidden; break-after: page; }
    .page:last-of-type { break-after: auto; }
    .sign { position: absolute; top: 0.75in; width: 5in; height: 7in; }
    .sign.left { left: 0.5in; } .sign.right { left: 5.5in; }
    .frame, .marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0.62in 0.62in 0.55in; box-sizing: border-box; }
    .kicker { font-family: "Cormorant SC", serif; font-weight: 600; font-size: 7.5pt; letter-spacing: 0.24em; }
    .script { font-family: "Pinyon Script", "Snell Roundhand", cursive; font-size: 34pt; line-height: 1; margin-top: 10pt; padding: 0 6pt 4pt;
              background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .num { font-family: "Bodoni Moda", Didot, "Bodoni 72", serif; font-weight: 600; font-size: 84pt; line-height: 0.95; margin-top: -4pt; }
    .rule { width: 0.7in; height: 1.5px; background: var(--foil); margin: 12pt auto 12pt; flex: none; }
    .names { columns: 2; column-gap: 0.28in; width: 100%; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 11.5pt; line-height: 1.5; text-align: center; }
    .names div { break-inside: avoid; white-space: nowrap; }
    .names.dense { font-size: 10.5pt; line-height: 1.42; }
    .side { position: absolute; left: 0; right: 0; bottom: 0.12in; text-align: center; font: 7pt system-ui, sans-serif; color: #000; letter-spacing: 0.05em; }
    .bar { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 18px 0 0; font: 14px system-ui, sans-serif; color: #333; }
    .bar button { font: 600 15px system-ui, sans-serif; color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
    @media print { html, body { background: none; } .page { margin: 0; box-shadow: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <span>5 × 7 table signs · 2 per 8.5 × 11 sheet · print two-sided, <b>flip on short edge</b> · cut on the marks</span>
    <button onclick="print()">Print table signs</button>
  </div>

  <script>
    // Guests per table, from Downloads/table names.png. Sorted by last name on the sign.
    const TABLES = [
      { n: 1, guests: ["Joaquin Vargas", "Vinny Furio", "Lisa Furio", "Laura Bell", "Oneida Vargas", "Rosa Bakody", "Phil Bakody",
        "Michel Focard de Fontefiguieres", "Shirley Focard de Fontefiguieres", "Howard Smith", "Abraham Vargas", "Taree Vargas",
        "Jameson Bell", "Jackson Bell", "Lincoln Bell", "Percy Smith", "Mariel Smith", "Russell Smith"] },
      { n: 2, guests: ["Stevie Graham", "Fred Stevens-Smith", "Patrick Coleman", "Reed Allman", "Emily Coombes", "Louise McKenna",
        "Lucia Finneran", "Daniel Finneran", "Peter Scott", "Amy Scott", "Stephanie Noriega", "Rachel Walford", "Stevie Braysher",
        "James Walford", "Madhvi Reddi", "Laks Srini", "Jason Luce", "Cathryn McNab", "Francis Hinchey", "Jamie Hinchey",
        "Geraldo Wingate", "Roxy Wingate", "Eunice Bravo", "Manora Ginige", "Sonali Ginige", "Stuart Garcia"] },
      { n: 3, guests: ["Adam Sterling", "Kelly Sterling", "Candice Vicuña", "Alpa Shah", "Leela Hayes", "Harry Hayes", "Bobby Hayes",
        "Bogdan Pyzh", "Marta Pyzh", "Roman Khomenko Jr.", "Rodrigo Vicuña", "Sierra Vicuña", "Alisha Terry", "Maika Terry",
        "Kestrel Terry", "Nate Terry", "Roman Khomenko", "Liliia Khomenko"] }
    ];

    // Sort key: surname (skipping "Jr." and particles like "de"), then first name.
    const surname = full => { const w = full.replace(/\s+Jr\.?$/, "").split(" ");
      const i = w.findIndex((x, k) => k > 0 && /^(de|da|van|von)$/i.test(x)); return (i > 0 ? w.slice(1).join(" ") : w[w.length - 1]); };
    const byLast = (a, b) => surname(a).localeCompare(surname(b)) || a.localeCompare(b);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const W = 480, H = 672, m = 30, g = 12, r = 26; // sign size (96 dpi), frame inset, line offset, corner radius
    const notched = (x0, y0, x1, y1, r) =>
      `M${x0 + r},${y0} H${x1 - r} A${r},${r} 0 0 0 ${x1},${y0 + r} V${y1 - r} A${r},${r} 0 0 0 ${x1 - r},${y1}` +
      ` H${x0 + r} A${r},${r} 0 0 0 ${x0},${y1 - r} V${y0 + r} A${r},${r} 0 0 0 ${x0 + r},${y0} Z`;
    const frame = `<svg class="frame" viewBox="0 0 ${W} ${H}" aria-hidden="true">
      <defs><linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="${H}">
        <stop offset="0" stop-color="#6e3f22"/><stop offset="0.12" stop-color="#b8743f"/><stop offset="0.22" stop-color="#ecbd92"/>
        <stop offset="0.32" stop-color="#c4824d"/><stop offset="0.46" stop-color="#7a4527"/><stop offset="0.6" stop-color="#d79b6b"/>
        <stop offset="0.68" stop-color="#f2cba3"/><stop offset="0.8" stop-color="#b06c3a"/><stop offset="1" stop-color="#74411f"/>
      </linearGradient></defs>
      <g fill="none" stroke="url(#copper)" stroke-width="1.9">
        <path d="${notched(m + g, m, W - m - g, H - m, r)}"/><path d="${notched(m, m + g, W - m, H - m - g, r)}"/>
      </g></svg>`;
    // Crop marks on the 1056 × 816 sheet: cut lines x = 48, 528, 1008; y = 72, 744.
    const marks = `<svg class="marks" viewBox="0 0 1056 816" aria-hidden="true"><g stroke="#000" stroke-width="0.75">
      <line x1="48" y1="0" x2="48" y2="60"/><line x1="528" y1="0" x2="528" y2="60"/><line x1="1008" y1="0" x2="1008" y2="60"/>
      <line x1="48" y1="756" x2="48" y2="816"/><line x1="528" y1="756" x2="528" y2="816"/><line x1="1008" y1="756" x2="1008" y2="816"/>
      <line x1="0" y1="72" x2="36" y2="72"/><line x1="0" y1="744" x2="36" y2="744"/>
      <line x1="1020" y1="72" x2="1056" y2="72"/><line x1="1020" y1="744" x2="1056" y2="744"/></g></svg>`;

    const sign = (t, slot) => !t ? "" : `<div class="sign ${slot}">${frame}<div class="content">
      <div class="kicker">Russell &amp; Mariel · October 17, 2026</div>
      <div class="script">Table</div>
      <div class="num">${t.n}</div>
      <div class="rule"></div>
      <div class="names${t.guests.length > 22 ? " dense" : ""}">${t.guests.slice().sort(byLast).map(n => `<div>${esc(n)}</div>`).join("")}</div>
    </div></div>`;

    // Pair tables two per sheet; each sheet gets a front and a back (left/right swapped for short-edge flip).
    for (let i = 0; i < TABLES.length; i += 2) {
      const a = TABLES[i], b = TABLES[i + 1], label = b ? "Tables " + a.n + " + " + b.n : "Table " + a.n;
      [["FRONT", a, b], ["BACK", b, a]].forEach(([side, L, R]) => {
        const page = document.createElement("div");
        page.className = "page";
        page.innerHTML = sign(L, "left") + sign(R, "right") + marks + `<div class="side">${label} · ${side} · 5 × 7 in · cut on the marks</div>`;
        document.body.appendChild(page);
      });
    }

    // Long names: shrink a column entry slightly if it would overflow its column.
    document.fonts.ready.then(() => document.querySelectorAll(".names div").forEach(el => {
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && size > 7) { size -= 0.5; el.style.fontSize = size + "px"; }
    }));
  </script>
</body>
</html>
