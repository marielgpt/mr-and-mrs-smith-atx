<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Vargas Wedding · Place cards</title>
  <!-- Flat place cards, 3.5 × 2 in, ten per 8.5 × 11 sheet (2 columns × 5 rows, sharing cut lines)
       with crop marks. Styled after Downloads/cardinspo.jpeg: navy didone first name, copper-foil
       script last name tucked under it, optional letterspaced small-caps note (e.g. an allergy),
       rose-copper ticket frame (square inner line + outer line stepping in with a quarter-circle at
       each corner). Fonts matched to the printed Minted cards: Prata caps, Monsieur La Doulaise script. Edit CARDS below: [first, last, note]. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Cormorant+SC:wght@600&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <style>
    @page { size: letter portrait; margin: 0; }
    :root { --navy: #2f4a6e;
            --foil: linear-gradient(115deg, #7c4a3c 0%, #b87a62 14%, #ecc3ad 24%, #c48a70 34%, #8a5446 48%, #d6a089 62%, #f3d2c0 70%, #ad725c 82%, #7a4638 100%); }
    html, body { margin: 0; background: #ecebe8; }
    body { color: var(--navy); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* 8.5 × 11 sheet; card grid starts at (0.75 in, 0.5 in), 3.5 × 2 in cells. */
    .page { position: relative; width: 8.5in; height: 11in; margin: 24px auto; background: #fff; box-shadow: 0 12px 32px rgba(30,40,60,.18); overflow: hidden; break-after: page; }
    .page:last-of-type { break-after: auto; }
    .card { position: absolute; width: 3.5in; height: 2in; }
    .frame, .marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 2pt; }
    .first { font-family: "Prata", Didot, "Bodoni 72", serif; font-weight: 400; font-size: 22pt; letter-spacing: 0.06em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
    /* Last name: SVG text filled with the copper-foil gradient (prints cleaner than background-clip text). */
    .last { display: block; width: 3.5in; height: 0.44in; margin-top: 0pt; overflow: visible; }
    .last text { font-family: "Monsieur La Doulaise", "Snell Roundhand", cursive; font-size: 27px; }
    .note { font-family: "Cormorant SC", "Bodoni Moda", serif; font-weight: 600; font-size: 6.5pt; letter-spacing: 0.24em; margin-top: 6pt; }
    .bar { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 18px 0 0; font: 14px system-ui, sans-serif; color: #333; }
    .bar button { font: 600 15px system-ui, sans-serif; color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
    @media print { html, body { background: none; } .page { margin: 0; box-shadow: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <span>3.5 × 2 in place cards · 10 per 8.5 × 11 sheet · cut on the marks</span>
    <button onclick="print()">Print place cards</button>
  </div>

  <script>
    // [first name, last name, optional note]
    const CARDS = [
      ["Mariel", "Smith", ""],
      ["Stevie", "Graham", ""]
    ];

    const DPI = 96, CW = 3.5 * DPI, CH = 2 * DPI, X0 = 0.75 * DPI, Y0 = 0.5 * DPI, COLS = 2, ROWS = 5, PER = COLS * ROWS;
    const PW = 8.5 * DPI, PH = 11 * DPI;
    // Ticket frame: inner rectangle with square corners, plus an outer line that steps in at each
    // corner — a short straight stub, a quarter circle centred on the inner rectangle's corner, and a
    // stub back out — exactly like the printed cards.
    const ticket = (bx0, by0, bx1, by1, d, r) => {
      const ax0 = bx0 + d, ay0 = by0 + d, ax1 = bx1 - d, ay1 = by1 - d;
      const outer = `M${ax0 + r},${by0} H${ax1 - r} V${ay0} A${r},${r} 0 0 0 ${ax1},${ay0 + r} H${bx1}` +
        ` V${ay1 - r} H${ax1} A${r},${r} 0 0 0 ${ax1 - r},${ay1} V${by1} H${ax0 + r} V${ay1}` +
        ` A${r},${r} 0 0 0 ${ax0},${ay1 - r} H${bx0} V${ay0 + r} H${ax0} A${r},${r} 0 0 0 ${ax0 + r},${ay0} Z`;
      return { inner: `M${ax0},${ay0} H${ax1} V${ay1} H${ax0} Z`, outer };
    };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const m = 18, d = 7, r = 14; // outer line inset from the trim, gap to the inner line, corner radius
    const T = ticket(m, m, CW - m, CH - m, d, r);

    const frame = `<svg class="frame" viewBox="0 0 ${CW} ${CH}" aria-hidden="true">
      <defs><linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${CW}" y2="${CH}">
        <stop offset="0" stop-color="#7c4a3c"/><stop offset="0.12" stop-color="#b87a62"/><stop offset="0.22" stop-color="#ecc3ad"/>
        <stop offset="0.32" stop-color="#c48a70"/><stop offset="0.46" stop-color="#8a5446"/><stop offset="0.6" stop-color="#d6a089"/>
        <stop offset="0.68" stop-color="#f3d2c0"/><stop offset="0.8" stop-color="#ad725c"/><stop offset="1" stop-color="#7a4638"/>
      </linearGradient></defs>
      <g fill="none" stroke="url(#copper)" stroke-width="1.1">
        <path d="${T.inner}"/><path d="${T.outer}"/>
      </g></svg>`;

    // Crop marks only around the rows actually used; cards share cut lines so each mark serves two.
    const marks = rows => {
      const xs = [0, 1, 2].map(i => X0 + i * CW), ys = Array.from({ length: rows + 1 }, (_, i) => Y0 + i * CH), L = [];
      const yEnd = ys[ys.length - 1], gap = 8;
      xs.forEach(x => { L.push([x, 0, x, Y0 - gap], [x, yEnd + gap, x, Math.min(PH, yEnd + gap + 36)]); });
      ys.forEach(y => { L.push([0, y, X0 - gap, y], [PW - X0 + gap, y, PW, y]); });
      return `<svg class="marks" viewBox="0 0 ${PW} ${PH}" aria-hidden="true"><g stroke="#000" stroke-width="0.75">` +
        L.map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`).join("") + `</g></svg>`;
    };

    for (let p = 0; p < CARDS.length; p += PER) {
      const batch = CARDS.slice(p, p + PER), page = document.createElement("div");
      page.className = "page";
      page.innerHTML = batch.map(([first, last, note], i) => {
        const col = i % COLS, row = Math.floor(i / COLS);
        return `<div class="card" style="left:${X0 + col * CW}px;top:${Y0 + row * CH}px">${frame}
          <div class="content"><div class="first">${esc(first)}</div><svg class="last" viewBox="0 0 ${CW} 42" aria-label="${esc(last)}">
            <defs><linearGradient id="foil${p + i}" gradientUnits="userSpaceOnUse" x1="${CW / 2 - 70}" y1="6" x2="${CW / 2 + 70}" y2="40">
              <stop offset="0" stop-color="#8a5446"/><stop offset="0.25" stop-color="#c48a70"/><stop offset="0.42" stop-color="#ecc3ad"/>
              <stop offset="0.58" stop-color="#b87a62"/><stop offset="0.78" stop-color="#8a5446"/><stop offset="1" stop-color="#d6a089"/>
            </linearGradient></defs>
            <text x="${CW / 2}" y="30" text-anchor="middle" fill="url(#foil${p + i})">${esc(last)}</text></svg>
          ${note ? `<div class="note">${esc(note)}</div>` : ""}</div></div>`;
      }).join("") + marks(Math.ceil(batch.length / COLS));
      document.body.appendChild(page);
    }
  </script>
</body>
</html>
