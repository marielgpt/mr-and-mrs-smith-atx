<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Vargas Wedding · Specialty drink signs</title>
  <!-- Printable specialty drink signs: 5 × 7 in, two per 8.5 × 11 sheet (landscape), with crop marks.
       Double-sided — the back of each sheet repeats the same two signs, so each one reads from
       both sides on a bar stand. The signs share one cut line down the middle; the layout is
       centred, so the marks line up whichever way the printer flips the sheet. Print → "Save as
       PDF" or straight to the printer.

       Two drinks (Pimm's Cup, Eastern Standard Fizz) use the "classic" look, styled after
       photos/sign.html: copper double frame with notched corners, navy didone caps, copper
       script, letterspaced small caps, simple line-art glass icon. Ranch Water uses a "casual"
       look instead — plain card, big red marker-script name — matching the existing
       "I love you so much" print already in the décor (ref/loveyouverymuchframe.png /
       Downloads/il_1588xN.4298634848_34sq.webp). Edit DRINKS below; each entry's `style` picks
       the template. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Cormorant+Garamond:wght@500;600&family=Cormorant+SC:wght@600&family=Permanent+Marker&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    @page { size: letter landscape; margin: 0; }
    :root { --navy: #2f4a6e; --lovered: #b3271e;
            --foil: linear-gradient(115deg, #6e3f22 0%, #b8743f 14%, #ecbd92 24%, #c4824d 34%, #7a4527 48%, #d79b6b 62%, #f2cba3 70%, #b06c3a 82%, #74411f 100%); }
    .foil { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
    html, body { margin: 0; background: #ecebe8; }
    body { color: var(--navy); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* 11 × 8.5 in sheet; two 5 × 7 trims side by side at x 0.5 → 5.5 → 10.5 in, y 0.75 → 7.75 in. */
    .page { position: relative; width: 11in; height: 8.5in; margin: 24px auto; background: #fff; box-shadow: 0 12px 32px rgba(30,40,60,.18); overflow: hidden; break-after: page; }
    .page:last-of-type { break-after: auto; }
    .sign { position: absolute; top: 0.75in; width: 5in; height: 7in; }
    .sign.left { left: 0.5in; } .sign.right { left: 5.5in; }
    .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0.55in 0.5in; box-sizing: border-box; }
    .kicker { font-family: "Cormorant SC", serif; font-weight: 600; font-size: 8pt; letter-spacing: 0.2em; white-space: nowrap; }
    /* Label ("Cocktail" / "Mocktail"): SVG text with the foil gradient (background-clip text clips
       swashes in print). */
    .script { display: block; width: 3.9in; height: 0.6in; margin-top: 6pt; overflow: visible; }
    .script text { font-family: "Pinyon Script", "Snell Roundhand", cursive; font-size: 34px; }
    .name { display: inline-block; font-family: "Bodoni Moda", Didot, "Bodoni 72", serif; font-weight: 600; font-size: 19pt; letter-spacing: 0.03em; line-height: 1.1; margin-top: -2pt; white-space: nowrap; }
    .glass { width: 0.8in; height: 1.05in; margin-top: 6pt; }
    .rule { width: 0.7in; height: 1.5px; background: var(--foil); margin: 10pt auto 9pt; flex: none; }
    .ingredients { max-width: 3.9in; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 11pt; line-height: 1.5; }
    .ingredients span { display: inline-block; }
    .note { font-family: "Cormorant SC", serif; font-weight: 600; font-size: 7.5pt; letter-spacing: 0.18em; color: var(--navy); margin-top: 10pt; opacity: 0.85; white-space: nowrap; }

    /* Casual card: plain white, no copper frame — big red marker-script name, like the existing
       "I love you so much" print. */
    .sign.casual .content { padding: 0.7in 0.5in; }
    .casual-kicker { font-family: "Cormorant SC", serif; font-weight: 600; font-size: 8pt; letter-spacing: 0.2em; color: #8a8378; white-space: nowrap; }
    .casual-label { font-family: "Cormorant SC", serif; font-weight: 600; font-size: 9pt; letter-spacing: 0.22em; color: var(--lovered); opacity: 0.75; margin-top: 12pt; white-space: nowrap; }
    .casual-name { font-family: "Permanent Marker", cursive; color: var(--lovered); font-size: 52pt; line-height: 1.12; margin-top: 18pt; transform: rotate(-2deg); }
    .casual-note { font-family: "Permanent Marker", cursive; color: var(--lovered); font-size: 15pt; margin-top: 6pt; opacity: 0.9; transform: rotate(-2deg); }
    .casual-glass { width: 0.95in; height: 1.2in; margin-top: 10pt; }
    .casual-rule { width: 0.55in; height: 1.5px; background: #ded6c6; margin: 22pt auto 16pt; flex: none; }
    .casual-ingredients { max-width: 3.7in; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 12pt; color: #4a4038; line-height: 1.6; }
    .casual-ingredients span { display: inline-block; }

    .marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .side { position: absolute; left: 0; right: 0; bottom: 0.12in; text-align: center; font: 7pt system-ui, sans-serif; color: #000; letter-spacing: 0.05em; }
    .bar { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 18px 0 0; font: 14px system-ui, sans-serif; color: #333; }
    .bar button { font: 600 15px system-ui, sans-serif; color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
    @media print { html, body { background: none; } .page { margin: 0; box-shadow: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <span>Two 5 × 7 signs per 8.5 × 11 sheet · print double-sided · cut on the marks</span>
    <button onclick="print()">Print drink signs</button>
  </div>

  <!-- "Classic" sign: copper double frame, navy name, glass icon. Used for Pimm's Cup + the Fizz. -->
  <template id="sign-classic">
    <div class="sign">
      <!-- 480 × 672 = 5 × 7 in at 96 dpi. Two overlapping notched rectangles (one wider, one taller)
           — the stepped double frame from the inspo card. -->
      <svg class="frame" viewBox="0 0 480 672" aria-hidden="true">
        <defs>
          <!-- Copper foil: alternating shadow / highlight bands across the whole sign. -->
          <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="672">
            <stop offset="0" stop-color="#6e3f22"/><stop offset="0.12" stop-color="#b8743f"/>
            <stop offset="0.22" stop-color="#ecbd92"/><stop offset="0.32" stop-color="#c4824d"/>
            <stop offset="0.46" stop-color="#7a4527"/><stop offset="0.6" stop-color="#d79b6b"/>
            <stop offset="0.68" stop-color="#f2cba3"/><stop offset="0.8" stop-color="#b06c3a"/>
            <stop offset="1" stop-color="#74411f"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#copper)" stroke-width="1.9">
          <path class="tall" d=""/><path class="wide" d=""/>
        </g>
      </svg>
      <div class="content">
        <div class="kicker">The Smiths · October 17, 2026</div>
        <svg class="script" viewBox="0 0 400 64"><defs><linearGradient id="dfoil" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="340" y2="64">
          <stop offset="0" stop-color="#7a4527"/><stop offset="0.22" stop-color="#c4824d"/><stop offset="0.38" stop-color="#ecbd92"/>
          <stop offset="0.55" stop-color="#b8743f"/><stop offset="0.75" stop-color="#7a4527"/><stop offset="0.9" stop-color="#d79b6b"/><stop offset="1" stop-color="#b06c3a"/>
        </linearGradient></defs><text class="label" x="200" y="44" text-anchor="middle" fill="url(#dfoil)"></text></svg>
        <div class="name"></div>
        <div class="glass"></div>
        <div class="rule"></div>
        <div class="ingredients"></div>
        <div class="note"></div>
      </div>
    </div>
  </template>

  <!-- "Casual" sign: plain card, big red marker-script name — the "I love you so much" treatment. -->
  <template id="sign-casual">
    <div class="sign casual">
      <div class="content">
        <div class="casual-kicker">The Smiths · October 17, 2026</div>
        <div class="casual-label"></div>
        <div class="casual-name"></div>
        <div class="casual-glass"></div>
        <div class="casual-rule"></div>
        <div class="casual-ingredients"></div>
        <div class="casual-note"></div>
      </div>
    </div>
  </template>

  <!-- Crop marks on the 1056 × 816 sheet (11 × 8.5 in at 96 dpi). Cut lines: x = 48, 528, 1008;
       y = 72, 744. Marks stop short of the trim so none of them land on a finished sign. -->
  <template id="marks">
    <svg class="marks" viewBox="0 0 1056 816" aria-hidden="true">
      <g stroke="#000" stroke-width="0.75">
        <line x1="48" y1="0" x2="48" y2="60"/><line x1="528" y1="0" x2="528" y2="60"/><line x1="1008" y1="0" x2="1008" y2="60"/>
        <line x1="48" y1="756" x2="48" y2="816"/><line x1="528" y1="756" x2="528" y2="816"/><line x1="1008" y1="756" x2="1008" y2="816"/>
        <line x1="0" y1="72" x2="36" y2="72"/><line x1="0" y1="744" x2="36" y2="744"/>
        <line x1="1020" y1="72" x2="1056" y2="72"/><line x1="1020" y1="744" x2="1056" y2="744"/>
      </g>
    </svg>
  </template>

  <script>
    // Simple single-line glass icons, navy outline with the drink's own liquid colour — a highball
    // (cucumber + mint garnish) for the Pimm's Cup, a martini glass (lime wheel) for the mocktail,
    // each with a straw.
    const GLASS_HIGHBALL = `<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M38 55 L34 140 L86 140 L82 55 Z" fill="#c4824d" fill-opacity="0.55"/>
      <path d="M30 20 L90 20 L82 140 L38 140 Z" stroke="#2f4a6e" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="30" y1="20" x2="90" y2="20" stroke="#2f4a6e" stroke-width="2.5"/>
      <circle cx="30" cy="30" r="12" stroke="#2f4a6e" stroke-width="2" fill="none"/>
      <line x1="19" y1="30" x2="41" y2="30" stroke="#2f4a6e" stroke-width="1.5"/>
      <line x1="25" y1="21" x2="25" y2="39" stroke="#2f4a6e" stroke-width="1.5"/>
      <line x1="35" y1="21" x2="35" y2="39" stroke="#2f4a6e" stroke-width="1.5"/>
      <path d="M68 12 Q74 4 84 8 Q78 14 68 12 Z" stroke="#2f4a6e" stroke-width="1.5" fill="#8fa06f" fill-opacity="0.5"/>
      <line x1="97" y1="5" x2="66" y2="100" stroke="#2f4a6e" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;
    const GLASS_MARTINI = `<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M33 25 L87 25 L60 58 Z" fill="#aac08a" fill-opacity="0.65"/>
      <path d="M22 22 L60 92 L98 22" stroke="#2f4a6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="60" y1="92" x2="60" y2="134" stroke="#2f4a6e" stroke-width="2.5"/>
      <line x1="38" y1="138" x2="82" y2="138" stroke="#2f4a6e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M90 20 A10 10 0 0 1 98 24 L90 30 Z" stroke="#2f4a6e" stroke-width="1.5" fill="#d8dd7a" fill-opacity="0.7"/>
      <circle cx="94" cy="24" r="9" stroke="#2f4a6e" stroke-width="1.5" fill="none"/>
      <line x1="85" y1="24" x2="103" y2="24" stroke="#2f4a6e" stroke-width="1.2"/>
      <line x1="94" y1="15" x2="94" y2="33" stroke="#2f4a6e" stroke-width="1.2"/>
      <line x1="100" y1="2" x2="72" y2="70" stroke="#2f4a6e" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;

    // Loose, hand-drawn illustration icons for the casual sheet — styled after
    // Downloads/insposigniloveyousomuch.webp (sketchy ink outline + a few painted colour details).
    // The wobble comes from an SVG turbulence filter rather than hand-plotted wobbly paths.
    const SKETCHY_FILTER = `<filter id="FILTID" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="SEED" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>`;
    const INK = "#4a3a2e";
    // Ranch Water, sketch style: highball, pale liquid, lime wedge on the rim.
    const GLASS_HIGHBALL_SKETCH = `<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>${SKETCHY_FILTER.replace("FILTID", "sketch1").replace("SEED", "3")}</defs>
      <g filter="url(#sketch1)">
        <path d="M38 55 L34 140 L86 140 L82 55 Z" fill="#e7edc4" fill-opacity="0.7"/>
        <path d="M30 20 L90 20 L82 140 L38 140 Z" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M22 28 A14 14 0 0 1 36 14 L36 28 Z" fill="#9fbf5a" fill-opacity="0.8" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M24.5 24.5 L31 18 M27 27.5 L34 20.5" stroke="${INK}" stroke-width="0.8"/>
        <path d="M100 4 Q94 2 90 8 Q96 12 100 4" stroke="#c4824d" stroke-width="1.6" fill="none"/>
        <line x1="97" y1="6" x2="66" y2="100" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </svg>`;
    // Eastern Standard Fizz, sketch style: the same martini glass + lime wheel + mint as the
    // classic card, just drawn with the loose ink line for the casual sheet.
    const GLASS_MARTINI_SKETCH = `<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>${SKETCHY_FILTER.replace("FILTID", "sketch2").replace("SEED", "7")}</defs>
      <g filter="url(#sketch2)">
        <path d="M33 25 L87 25 L60 58 Z" fill="#aac08a" fill-opacity="0.6"/>
        <path d="M22 22 L60 92 L98 22" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="60" y1="92" x2="60" y2="128" stroke="${INK}" stroke-width="2.2"/>
        <line x1="40" y1="132" x2="80" y2="132" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="94" cy="22" r="9" stroke="${INK}" stroke-width="1.5" fill="#d8dd7a" fill-opacity="0.6"/>
        <path d="M85 22 L103 22 M94 13 L94 31" stroke="${INK}" stroke-width="1.1"/>
        <path d="M24 10 Q34 4 32 14 Q24 18 24 10" fill="#8fa06f" fill-opacity="0.7" stroke="${INK}" stroke-width="1.2"/>
        <line x1="100" y1="4" x2="70" y2="72" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </svg>`;

    // Each drink: `style` picks the template ("classic" or "casual"). Classic drinks need a
    // label, glass icon, and optional serving note; casual drinks are plain, with an optional
    // handwritten note line.
    const DRINKS = [
      { id: "pimms", style: "classic", label: "Signature Cocktail", name: "Pimm’s Cup", glass: GLASS_HIGHBALL,
        ingredients: ["Bombay Sapphire gin", "Pimm’s No. 1", "\n", "Barrow’s Ginger", "cucumber", "club soda"] },
      { id: "fizz", style: "classic", label: "Signature Mocktail", name: "Eastern Standard Fizz", glass: GLASS_MARTINI,
        ingredients: ["Seedlip Garden", "cucumber", "\n", "mint", "lime", "soda"] },
      { id: "ranchwater", style: "casual", label: "Signature Cocktail", name: "Ranch\nWater", note: "cheers, y’all.",
        glass: GLASS_HIGHBALL_SKETCH, ingredients: ["Patrón Silver tequila", "lime", "orange bitters", "club soda"] },
      // Pairs with Ranch Water on the "casual" sheet — the same Eastern Standard Fizz as above,
      // just given the "I love you so much" treatment (ref/loveyouverymuchframe.png) instead of
      // the formal copper/navy look.
      { id: "fizz-casual", style: "casual", label: "Signature Mocktail", name: "Eastern Standard\nFizz", nameSize: "30pt",
        note: "with so much love.", glass: GLASS_MARTINI_SKETCH, ingredients: ["Seedlip Garden", "cucumber", "\n", "mint", "lime", "soda"] }
    ];

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    // "\n" in an ingredients list forces a line break there (e.g. to control the wrap on the
    // Pimm's Cup card) instead of relying on the browser's natural wrap point.
    const ingredientsHtml = ing => ing.map((x, i) => {
      if (x === "\n") return "<br>";
      const isLast = i === ing.length - 1, nextIsBreak = ing[i + 1] === "\n";
      return `<span>${esc(x)}${!isLast && !nextIsBreak ? " ·" : ""}</span>`;
    }).join(" ");

    // Concave-cornered rectangle: each corner is a quarter circle centred on the corner point.
    const notched = (x0, y0, x1, y1, r) =>
      `M${x0 + r},${y0} H${x1 - r} A${r},${r} 0 0 0 ${x1},${y0 + r} V${y1 - r} A${r},${r} 0 0 0 ${x1 - r},${y1}` +
      ` H${x0 + r} A${r},${r} 0 0 0 ${x0},${y1 - r} V${y0 + r} A${r},${r} 0 0 0 ${x0 + r},${y0} Z`;
    const W = 480, H = 672, m = 30, g = 12, r = 26; // sign size, margin from the trim, line offset, corner radius

    const makeSign = (d, cls) => {
      if (!d) { const blank = document.createElement("div"); blank.className = "sign " + cls; return blank; }
      if (d.style === "casual") {
        const s = document.getElementById("sign-casual").content.firstElementChild.cloneNode(true);
        s.classList.add(cls);
        s.querySelector(".casual-label").textContent = d.label || "";
        const nameEl = s.querySelector(".casual-name");
        nameEl.innerHTML = esc(d.name).replace(/\n/g, "<br>");
        if (d.nameSize) nameEl.style.fontSize = d.nameSize;
        if (d.glass) s.querySelector(".casual-glass").innerHTML = d.glass;
        s.querySelector(".casual-ingredients").innerHTML = ingredientsHtml(d.ingredients);
        if (d.note) s.querySelector(".casual-note").textContent = d.note; else s.querySelector(".casual-note").remove();
        return s;
      }
      const s = document.getElementById("sign-classic").content.firstElementChild.cloneNode(true);
      s.classList.add(cls);
      s.querySelector(".tall").setAttribute("d", notched(m + g, m, W - m - g, H - m, r));
      s.querySelector(".wide").setAttribute("d", notched(m, m + g, W - m, H - m - g, r));
      s.querySelector(".label").textContent = d.label;
      s.querySelector(".name").textContent = d.name;
      s.querySelector(".glass").innerHTML = d.glass;
      s.querySelector(".ingredients").innerHTML = ingredientsHtml(d.ingredients);
      if (d.note) s.querySelector(".note").textContent = d.note;
      return s;
    };

    // Two signs per sheet; the last sheet gets a blank slot if there's an odd one out. Each sheet
    // prints FRONT + an identical BACK so every sign reads from both sides.
    for (let i = 0; i < DRINKS.length; i += 2) {
      const pair = [DRINKS[i], DRINKS[i + 1]];
      ["FRONT", "BACK"].forEach(label => {
        const page = document.createElement("div");
        page.className = "page";
        page.append(makeSign(pair[0], "left"), makeSign(pair[1], "right"), document.getElementById("marks").content.firstElementChild.cloneNode(true));
        const side = document.createElement("div");
        side.className = "side";
        side.textContent = label + " · two 5 × 7 in signs · cut on the marks";
        page.append(side);
        document.body.insertBefore(page, document.querySelector("script"));
      });
    }

    // Long drink names (classic style): shrink until it fits on one line inside the frame.
    document.fonts.ready.then(() => document.querySelectorAll(".name").forEach(el => {
      const max = W - 2 * (m + g) - 40;
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.offsetWidth > max && size > 9) { size -= 0.5; el.style.fontSize = size + "px"; }
    }));

    // Long labels ("Signature Cocktail" / "Signature Mocktail"): shrink the SVG script text until
    // it fits inside its 400-unit-wide viewBox, with margin either side.
    document.fonts.ready.then(() => document.querySelectorAll(".script .label").forEach(el => {
      const max = 400 - 2 * 24;
      let size = 34;
      while (el.getComputedTextLength() > max && size > 14) { size -= 1; el.style.fontSize = size + "px"; }
    }));
  </script>
</body>
</html>
