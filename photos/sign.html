<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Vargas Wedding · Photo sign</title>
  <link rel="stylesheet" href="../styles.css?v=40">
  <!-- Printable QR sign for /photos/. Letter, portrait. Print → "Save as PDF" or straight to the printer.
       qr.svg / qr.png are the same code on their own (qr.png is 1200px for Canva / a print shop). -->
  <style>
    @page { size: letter portrait; margin: 0; }
    :root { --color-bg: #fefcf7; --color-text: #201e1d; --color-accent: #c67139; --color-accent-700: #8c491a; --color-neutral-700: #645c50;
            --font-heading: "Caprasimo", system-ui, sans-serif; --font-body: "Figtree", system-ui, sans-serif; }
    html, body { margin: 0; background: #e9e4da; }
    body { font-family: var(--font-body); color: var(--color-text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet { width: 8.5in; height: 11in; margin: 24px auto; background: var(--color-bg); box-shadow: 0 12px 32px rgba(46,43,37,.22);
             box-sizing: border-box; padding: 0.9in 0.8in; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .frame { border: 2px solid var(--color-accent); border-radius: 36px; padding: 0.6in 0.5in; width: 100%; box-sizing: border-box;
             display: flex; flex-direction: column; align-items: center; gap: 0.22in; }
    .kicker { font-size: 13pt; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 700; }
    h1 { font-family: var(--font-heading); font-weight: 400; font-size: 46pt; line-height: 1.05; margin: 0; }
    .lede { font-size: 17pt; line-height: 1.35; max-width: 5.6in; margin: 0; }
    .qr { width: 3.6in; height: 3.6in; padding: 0.22in; background: #fff; border-radius: 22px; }
    .qr img { width: 100%; height: 100%; display: block; }
    .code { font-size: 18pt; } .code b { font-family: var(--font-heading); font-weight: 400; font-size: 26pt; letter-spacing: 0.12em; color: var(--color-accent-700); margin-left: 6px; }
    .days { font-size: 13pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700); }
    .url { font-size: 11pt; color: var(--color-neutral-700); }
    .bar { text-align: center; padding: 18px 0 0; }
    @media print { html, body { background: none; } .sheet { margin: 0; box-shadow: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar"><button class="btn btn-primary" onclick="print()" style="font-family: var(--font-body); font-weight: 700; padding: 10px 22px">Print sign</button></div>
  <div class="sheet">
    <div class="frame">
      <div class="kicker">Russell + Mariel</div>
      <h1>Share your photos</h1>
      <p class="lede">Scan to add your photos + videos from the weekend and see everyone else’s.</p>
      <div class="qr"><img src="qr.svg" alt="QR code to the guest photo page"></div>
      <div class="code">Code <b>1017</b></div>
      <div class="days">BBQ · Party · Wedding</div>
      <div class="url">marielgpt.github.io/mr-and-mrs-smith-atx/photos</div>
    </div>
  </div>
</body>
</html>
