<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Vargas Wedding · Photo signs</title>
  <!-- Printable QR table signs for /photos/: 5 × 7 in, two per 8.5 × 11 sheet (landscape), with crop
       marks. Double-sided — page 2 is the same two signs, so each sign reads from both sides.
       The signs share one cut line down the middle; the layout is centred, so the marks line up
       whichever way the printer flips the sheet. Print → "Save as PDF" or straight to the printer.
       Styled after photos/inspo.png: copper double frame with notched corners, navy didone caps,
       copper script, letterspaced small caps. qr.svg / qr.png are the bare code (qr.png is 1200px). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Cormorant+SC:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    @page { size: letter landscape; margin: 0; }
    :root { --navy: #2f4a6e; --copper: #a8714f;
            /* Copper foil: dark shadow bands + bright highlights so print reads as metallic, not brown. */
            --foil: linear-gradient(115deg, #6e3f22 0%, #b8743f 14%, #ecbd92 24%, #c4824d 34%, #7a4527 48%, #d79b6b 62%, #f2cba3 70%, #b06c3a 82%, #74411f 100%); }
    .foil { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
    html, body { margin: 0; background: #ecebe8; }
    body { color: var(--navy); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* 11 × 8.5 in sheet; two 5 × 7 trims side by side at x 0.5 → 5.5 → 10.5 in, y 0.75 → 7.75 in. */
    .page { position: relative; width: 11in; height: 8.5in; margin: 24px auto; background: #fff; box-shadow: 0 12px 32px rgba(30,40,60,.18); overflow: hidden; break-after: page; }
    .page:last-of-type { break-after: auto; }
    .sign { position: absolute; top: 0.75in; width: 5in; height: 7in; }
    .sign.left { left: 0.5in; } .sign.right { left: 5.5in; }
    .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0.7in 0.6in; box-sizing: border-box; }
    .names { font-family: "Bodoni Moda", Didot, "Bodoni 72", serif; font-weight: 600; font-size: 22pt; letter-spacing: 0.04em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
    /* Script line: SVG text with the foil gradient (background-clip text clips swashes in print). */
    .script { display: block; width: 4.17in; height: 0.67in; margin: 2pt 0 6pt; overflow: visible; }
    .script text { font-family: "Pinyon Script", "Snell Roundhand", cursive; font-size: 40px; }
    .caps { font-family: "Cormorant SC", "Bodoni Moda", serif; font-weight: 600; letter-spacing: 0.2em; }
    .lede { font-size: 9pt; margin: 0 0 12pt; line-height: 1.5; }
    .qr { width: 2in; height: 2in; }
    .qr img { width: 100%; height: 100%; display: block; }
    .code { font-size: 9pt; margin-top: 12pt; }
    .code b { font-family: "Bodoni Moda", Didot, serif; font-weight: 600; font-size: 15pt; letter-spacing: 0.14em; margin-left: 5pt; }
    .rule { width: 0.7in; height: 1.5px; background: var(--foil); margin: 10pt auto; }
    .days { font-size: 7.5pt; letter-spacing: 0.16em; white-space: nowrap; }
    .url { font-family: "Cormorant SC", serif; font-size: 10.5pt; letter-spacing: 0.06em; color: var(--copper); margin-top: 6pt; text-transform: lowercase; }

    .marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .side { position: absolute; left: 0; right: 0; bottom: 0.12in; text-align: center; font: 7pt system-ui, sans-serif; color: #000; letter-spacing: 0.05em; }
    .bar { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 18px 0 0; font: 14px system-ui, sans-serif; color: #333; }
    .bar button { font: 600 15px system-ui, sans-serif; color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
    @media print { html, body { background: none; } .page { margin: 0; box-shadow: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <span>Two 5 × 7 signs per 8.5 × 11 sheet · print double-sided · cut on the marks</span>
    <button onclick="print()">Print signs</button>
  </div>

  <template id="sign">
    <div class="sign">
      <!-- 480 × 672 = 5 × 7 in at 96 dpi. Two overlapping notched rectangles (one wider, one taller)
           — the stepped double frame from the inspo card. -->
      <svg class="frame" viewBox="0 0 480 672" aria-hidden="true">
        <defs>
          <!-- Copper foil: alternating shadow / highlight bands across the whole sign. -->
          <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="672">
            <stop offset="0" stop-color="#6e3f22"/><stop offset="0.12" stop-color="#b8743f"/>
            <stop offset="0.22" stop-color="#ecbd92"/><stop offset="0.32" stop-color="#c4824d"/>
            <stop offset="0.46" stop-color="#7a4527"/><stop offset="0.6" stop-color="#d79b6b"/>
            <stop offset="0.68" stop-color="#f2cba3"/><stop offset="0.8" stop-color="#b06c3a"/>
            <stop offset="1" stop-color="#74411f"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#copper)" stroke-width="1.9">
          <path class="tall" d=""/><path class="wide" d=""/>
        </g>
      </svg>
      <div class="content">
        <div class="names">Russell &amp; Mariel</div>
        <svg class="script" viewBox="0 0 400 64" aria-label="Share your photos"><defs><linearGradient id="sfoil" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="340" y2="64">
        <stop offset="0" stop-color="#7a4527"/><stop offset="0.22" stop-color="#c4824d"/><stop offset="0.38" stop-color="#ecbd92"/>
        <stop offset="0.55" stop-color="#b8743f"/><stop offset="0.75" stop-color="#7a4527"/><stop offset="0.9" stop-color="#d79b6b"/><stop offset="1" stop-color="#b06c3a"/>
      </linearGradient></defs><text x="200" y="44" text-anchor="middle" fill="url(#sfoil)">Share your photos</text></svg>
        <p class="lede caps">Scan to add photos + videos<br>from the weekend</p>
        <div class="qr"><img src="qr.svg?v=2" alt="QR code to the guest photo page"></div>
        <div class="code caps">Code <b>1017</b></div>
        <div class="rule"></div>
        <div class="days caps">BBQ &nbsp;·&nbsp; Lakeside Fiesta &nbsp;·&nbsp; Wedding</div>
        <div class="url foil">marielandrussell.com/photos</div>
      </div>
    </div>
  </template>

  <!-- Crop marks on the 1056 × 816 sheet (11 × 8.5 in at 96 dpi). Cut lines: x = 48, 528, 1008;
       y = 72, 744. Marks stop short of the trim so none of them land on a finished sign. -->
  <template id="marks">
    <svg class="marks" viewBox="0 0 1056 816" aria-hidden="true">
      <g stroke="#000" stroke-width="0.75">
        <line x1="48" y1="0" x2="48" y2="60"/><line x1="528" y1="0" x2="528" y2="60"/><line x1="1008" y1="0" x2="1008" y2="60"/>
        <line x1="48" y1="756" x2="48" y2="816"/><line x1="528" y1="756" x2="528" y2="816"/><line x1="1008" y1="756" x2="1008" y2="816"/>
        <line x1="0" y1="72" x2="36" y2="72"/><line x1="0" y1="744" x2="36" y2="744"/>
        <line x1="1020" y1="72" x2="1056" y2="72"/><line x1="1020" y1="744" x2="1056" y2="744"/>
      </g>
    </svg>
  </template>

  <script>
    // Concave-cornered rectangle: each corner is a quarter circle centred on the corner point.
    const notched = (x0, y0, x1, y1, r) =>
      `M${x0 + r},${y0} H${x1 - r} A${r},${r} 0 0 0 ${x1},${y0 + r} V${y1 - r} A${r},${r} 0 0 0 ${x1 - r},${y1}` +
      ` H${x0 + r} A${r},${r} 0 0 0 ${x0},${y1 - r} V${y0 + r} A${r},${r} 0 0 0 ${x0 + r},${y0} Z`;
    const W = 480, H = 672, m = 30, g = 12, r = 26; // sign size, margin from the trim, line offset, corner radius

    const makeSign = cls => {
      const s = document.getElementById("sign").content.firstElementChild.cloneNode(true);
      s.classList.add(cls);
      s.querySelector(".tall").setAttribute("d", notched(m + g, m, W - m - g, H - m, r));
      s.querySelector(".wide").setAttribute("d", notched(m, m + g, W - m, H - m - g, r));
      return s;
    };
    ["FRONT", "BACK"].forEach(label => {
      const page = document.createElement("div");
      page.className = "page";
      page.append(makeSign("left"), makeSign("right"), document.getElementById("marks").content.firstElementChild.cloneNode(true));
      const side = document.createElement("div");
      side.className = "side";
      side.textContent = label + " · two 5 × 7 in signs · cut on the marks";
      page.append(side);
      document.body.insertBefore(page, document.querySelector("script"));
    });
  </script>
</body>
</html>
